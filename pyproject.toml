[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "quaestio"
version = "0.1.0"
description = "MCP server for reliable question solving and verification."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.0.0", "python-dotenv>=1.0.0"]

[project.optional-dependencies]
math = ["sympy>=1.12"]
dev = ["pytest>=8.0"]
sdk = ["mcp>=1.0.0"]
pdf = ["pypdf>=5.0.0"]

[project.scripts]
quaestio = "quaestio.mcp_server:main"
quaestio-smoke = "quaestio.smoke_test:main"
quaestio-evaluate = "quaestio.evaluation:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-p no:cacheprovider"

[tool.setuptools.packages.find]
where = ["src"]
